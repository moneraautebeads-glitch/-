<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم استلام طلبك - متجر منيرة العتيبي للتكييف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f0f7fd;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .success-card {
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(52, 152, 219, 0.15);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 6px solid #3498db;
        }
        .icon-box {
            font-size: 60px;
            color: #2ecc71;
            margin-bottom: 20px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 28px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }
        .product-highlight {
            color: #3498db;
            font-weight: bold;
        }
        .back-btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="icon-box">❄️</div>
        <h2>شكراً لك!</h2>
        <p>لقد تم استلام طلبك بنجاح لمكيف: <span class="product-highlight">{{ product.title }}</span>.</p>
        <p>سيقوم فريقنا الفني بالتواصل معك قريباً لتأكيد موعد التوصيل والتركيب.</p>
        <a href="/" class="back-btn">العودة للرئيسية</a>
    </div>
</body>
</html>
